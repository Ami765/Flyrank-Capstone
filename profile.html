<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyrank Profile Settings</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <main class="profile-page">
    <form id="profile-form" novalidate>
      <h1>Profile & Settings</h1>
      <p class="form-status" aria-live="polite"></p>

      <div class="form-group">
        <label for="first-name">First name</label>
        <input type="text" id="first-name" name="firstName" autocomplete="given-name" aria-describedby="first-name-error" required>
        <span class="field-error" id="first-name-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="last-name">Last name</label>
        <input type="text" id="last-name" name="lastName" autocomplete="family-name" aria-describedby="last-name-error" required>
        <span class="field-error" id="last-name-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error" required>
        <span class="field-error" id="email-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" aria-describedby="username-error" required>
        <span class="field-error" id="username-error" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" rows="4" aria-describedby="bio-error" required></textarea>
        <span class="field-error" id="bio-error" role="alert"></span>
      </div>

      <button type="submit" class="primary-button">Save changes</button>
    </form>
  </main>

  <script src="profile-validation.js"></script>
  <script src="profile.js"></script>
</body>
</html>
